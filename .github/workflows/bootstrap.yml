name: Bootstrap Mudakir project

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/**"
      - ".github/workflows/bootstrap.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore project files
        shell: bash
        run: |
          test -f .bootstrap/mudakir-project.tar.gz.b64
          base64 --decode .bootstrap/mudakir-project.tar.gz.b64 > /tmp/mudakir-project.tar.gz
          tar -xzf /tmp/mudakir-project.tar.gz -C .
          rm -rf .bootstrap

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Type-check and build
        run: npm run check

      - name: Commit restored and verified project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add verified Mudakir application" || exit 0
          git push
