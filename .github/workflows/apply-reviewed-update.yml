name: Apply reviewed Mudakir update

on:
  push:
    branches: [main]
    paths:
      - ".bootstrap/**"
      - ".github/workflows/apply-reviewed-update.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore reviewed project archive
        shell: bash
        run: |
          cat .bootstrap/update.part.* > /tmp/mudakir-update.tar.gz.b64
          base64 --decode /tmp/mudakir-update.tar.gz.b64 > /tmp/mudakir-update.tar.gz
          echo "af0bc90755e27bf669002a13e2657e6276b4aa46cea38ffa82e50c752b0cbd11  /tmp/mudakir-update.tar.gz" | sha256sum -c -
          mkdir -p /tmp/mudakir-update
          tar -xzf /tmp/mudakir-update.tar.gz -C /tmp/mudakir-update
          rsync -a --delete --exclude='.git/' /tmp/mudakir-update/ ./

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check and build
        run: npm run check

      - name: Commit reviewed project
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply reviewed PWA and Render update" || exit 0
          git push
